aid: storecove

name: Storecove

description: Storecove provides e-invoicing software and a global compliance API. A single API connection gives businesses and ERP providers access
  to the Peppol network and to other e-invoicing networks such as DBNAlliance (USA), FACeB2B and Finvoice, along with e-invoicing and reporting
  compliance in markets including Belgium, France, Germany, India, Italy, Malaysia, Poland, Singapore and the UAE. Storecove handles invoice compliance,
  format conversion and delivery, and offers a free 30-day test account.

